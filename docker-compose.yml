version: "3.9"

services:
  db:
    image: postgres:15
    container_name: podpilot-db
    restart: always
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: . 
    container_name: podpilot-app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000
  
volumes:
  postgres_data: