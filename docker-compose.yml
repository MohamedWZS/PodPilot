version: "3.9"

services:
  db:
    image: postgres:15
    container_name: podpilot-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: podpilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: . 
    container_name: podpilot-app
    depends_on:
      - db
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/podpilot
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000
  
volumes:
  postgres_data: